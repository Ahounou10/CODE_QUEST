
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - CODE QUEST</title>
</head>
<body>

    <header>
        <a href="../index.html">
            <img src="../assets/images/logo.png" alt="Logo CODE QUEST" width="60">
            <span>CODE QUEST</span>
        </a>

        <nav>
            <a href="../index.html">Accueil</a>
            <a href="parcours.html">Parcours</a>
            <a href="projets.html">Projets</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Content de te revoir !</h1>
            <p>Connecte-toi pour continuer ton aventure sur CODE QUEST.</p>

            <form action="#" method="post">
                <div>
                    <label for="email">Adresse e-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="mot-de-passe">Mot de passe</label>
                    <input
                        type="password"
                        id="mot-de-passe"
                        name="mot_de_passe"
                        placeholder="Saisis ton mot de passe"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p>
                    <a href="#">Mot de passe oublié ?</a>
                </p>

                <button type="submit">Se connecter</button>
            </form>

            <p>
                Tu n'as pas encore de compte ?
                <a href="inscription.html">Créer un compte</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CODE QUEST - Apprends, pratique et progresse !</p>
    </footer>

</body>
</html>
